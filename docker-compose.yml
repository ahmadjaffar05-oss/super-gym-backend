version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: super-gym-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: super_gym
    ports:
      - "5432:5432"
    volumes:
      - super_gym_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  super_gym_pgdata:
